[build]
  command = "cd frontend && npm i && npm run build"
  publish = "frontend/dist"

[build.environment]
  # Sicherheits-Audit 2026-07-01: kein Node-Pin vorhanden, Netlifys Default
  # kann sich aendern und den Build unbemerkt brechen (vite@8 verlangt
  # ^20.19.0 || >=22.12.0). Node 22 ist Active LTS und der hier verifiziert
  # funktionierende Build-Node.
  NODE_VERSION = "22"

# Domain-Kanonisierung (Sprint User-Login 2026-07): das Login-Session-
# Cookie liegt auf api.creative-radar.de (SameSite=Lax) und wird vom
# Browser nur mitgeschickt, wenn die Seite auf derselben Domain-Familie
# (creative-radar.de) laeuft. Ueber die Alt-Domain
# creative-radar.ki-sicherheit.jetzt (oder die rohe netlify.app-URL)
# waere das Login kaputt — alte Lesezeichen landen darum per 301 auf
# app.creative-radar.de. Host-scoped Rules matchen nur den exakten
# Hostnamen: Deploy-Previews (deploy-preview-N--singular-unicorn-*.
# netlify.app) sind eigene Hosts und bleiben unberuehrt. Reihenfolge:
# VOR den Pfad-Rules unten — Netlify wertet Redirects von oben nach
# unten aus.
[[redirects]]
  from = "https://creative-radar.ki-sicherheit.jetzt/*"
  to = "https://app.creative-radar.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://singular-unicorn-bf4e79.netlify.app/*"
  to = "https://app.creative-radar.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://api.creative-radar.de/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security-Header (Audit 2026-08-17): Netlify setzt keine dieser Header von
# selbst — bislang kam das Prod-HTML komplett ohne aus (das Backend setzt
# dieselben drei bereits auf allen API-Antworten, main.py). X-Frame-Options
# DENY blockiert Clickjacking der Login-/Admin-UI per iframe; die App bettet
# sich selbst nirgends ein.
#
# (Hier stand bis zum 20.08.2026: "Bewusst OHNE Content-Security-Policy —
# muss erst gegen die real geladenen Ressourcen getestet werden." Der
# eigene Schritt kam dann noch im selben Audit; die CSP steht unten. Der
# Kommentar behauptete seither das Gegenteil der Datei, in der er steht.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HSTS (Audit-Schritt 5, 2026-08-17): Site ist HTTPS-only, Netlify stellt
    # die Zertifikate. Kein includeSubDomains — der Header gilt nur fuer
    # app.creative-radar.de, api.* setzt seine Header selbst (main.py).
    Strict-Transport-Security = "max-age=31536000"
    # CSP nach Ressourcen-Inventur (Audit-Schritt 5): Bundle-JS/CSS sind
    # self; Bilder kommen ueber die API (storage/thumbnails/img-Proxy,
    # siehe imageUrl.js); fetch() geht an die API (client.js). style-src
    # braucht 'unsafe-inline' fuer React-style-Attribute und die inline
    # gestylte Report-Vorschau (ReportsPanel iframe srcDoc). Kein externes
    # Font-/Script-CDN im Einsatz. Nach Aenderungen an Bildquellen hier
    # nachziehen — Verstoesse erscheinen in der Browser-Konsole.
    #
    # BEIDE API-Hosts (20.08.2026): dieselbe netlify.toml baut zwei Sites
    # — app.creative-radar.de gegen api.* und staging.creative-radar.de
    # gegen api-staging.* (``VITE_API_BASE`` je Site). Stand nur der
    # Prod-Host hier, blockierte der Browser auf Staging JEDEN fetch,
    # bevor er rausging: kein Request, kein Server-Log, im Frontend nur
    # der Auffang-Text "Code-Versand fehlgeschlagen". Genau so ist der
    # Staging-Login am 20.08. ausgefallen — die CSP kam mit dem Audit vom
    # 17.08., der Staging-Build vom 06.08. hatte sie noch nicht.
    #
    # Netlify kann diesen Header nicht pro Site variieren (context.* trennt
    # Branches, nicht Sites; beide bauen main als Production-Context).
    # Beide Hosts zu erlauben weitet die Prod-CSP um genau eine Domain,
    # die uns selbst gehoert — die Alternative waere eine zweite,
    # auseinanderlaufende Kopie dieser Datei.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.creative-radar.de https://api-staging.creative-radar.de; connect-src 'self' https://api.creative-radar.de https://api-staging.creative-radar.de; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
