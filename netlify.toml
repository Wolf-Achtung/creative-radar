[build]
  command = "cd frontend && npm i && npm run build"
  publish = "frontend/dist"

[build.environment]
  # Sicherheits-Audit 2026-07-01: kein Node-Pin vorhanden, Netlifys Default
  # kann sich aendern und den Build unbemerkt brechen (vite@8 verlangt
  # ^20.19.0 || >=22.12.0). Node 22 ist Active LTS und der hier verifiziert
  # funktionierende Build-Node.
  NODE_VERSION = "22"

# Domain-Kanonisierung (Sprint User-Login 2026-07): das Login-Session-
# Cookie liegt auf api.creative-radar.de (SameSite=Lax) und wird vom
# Browser nur mitgeschickt, wenn die Seite auf derselben Domain-Familie
# (creative-radar.de) laeuft. Ueber die Alt-Domain
# creative-radar.ki-sicherheit.jetzt (oder die rohe netlify.app-URL)
# waere das Login kaputt — alte Lesezeichen landen darum per 301 auf
# app.creative-radar.de. Host-scoped Rules matchen nur den exakten
# Hostnamen: Deploy-Previews (deploy-preview-N--singular-unicorn-*.
# netlify.app) sind eigene Hosts und bleiben unberuehrt. Reihenfolge:
# VOR den Pfad-Rules unten — Netlify wertet Redirects von oben nach
# unten aus.
[[redirects]]
  from = "https://creative-radar.ki-sicherheit.jetzt/*"
  to = "https://app.creative-radar.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://singular-unicorn-bf4e79.netlify.app/*"
  to = "https://app.creative-radar.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://api.creative-radar.de/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security-Header (Audit 2026-08-17): Netlify setzt keine dieser Header von
# selbst — bislang kam das Prod-HTML komplett ohne aus (das Backend setzt
# dieselben drei bereits auf allen API-Antworten, main.py). X-Frame-Options
# DENY blockiert Clickjacking der Login-/Admin-UI per iframe; die App bettet
# sich selbst nirgends ein. Bewusst OHNE Content-Security-Policy: eine CSP
# muss erst gegen die real geladenen Ressourcen (API-Bilder, R2/CDN-URLs)
# getestet werden, sonst bricht sie still die Bild-Anzeige — siehe Audit-
# Report, als eigener Schritt vorgeschlagen.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HSTS (Audit-Schritt 5, 2026-08-17): Site ist HTTPS-only, Netlify stellt
    # die Zertifikate. Kein includeSubDomains — der Header gilt nur fuer
    # app.creative-radar.de, api.* setzt seine Header selbst (main.py).
    Strict-Transport-Security = "max-age=31536000"
    # CSP nach Ressourcen-Inventur (Audit-Schritt 5): Bundle-JS/CSS sind
    # self; Bilder kommen ueber api.creative-radar.de (storage/thumbnails/
    # img-Proxy, siehe imageUrl.js); fetch() geht an api.* (client.js) und
    # relativ an /api/* (Report-Downloads via Netlify-Proxy). style-src
    # braucht 'unsafe-inline' fuer React-style-Attribute und die inline
    # gestylte Report-Vorschau (ReportsPanel iframe srcDoc). Kein externes
    # Font-/Script-CDN im Einsatz. Nach Aenderungen an Bildquellen hier
    # nachziehen — Verstoesse erscheinen in der Browser-Konsole.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.creative-radar.de; connect-src 'self' https://api.creative-radar.de; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
