[pytest]
pythonpath = .
asyncio_mode = auto
# Wartung 20.08.2026 — ``vertrag`` markiert Tests, die Quelldateien
# ausserhalb von backend/ lesen (heute: frontend/src). Sie pruefen
# Zusagen, die beide Seiten betreffen — Fehlertexte, Status-Labels,
# Filter-Defaults — und koennen deshalb durch eine reine
# Frontend-Aenderung brechen. backend-tests.yml triggert aber nur auf
# backend/**: genau so hat #366 einen gruenen PR gemergt, der
# test_die_pruefliste_verliert_nichts auf main brach (#367).
# Der Workflow vertrag-tests.yml fuehrt ``pytest -m vertrag`` bei
# Aenderungen an BEIDEN Seiten aus; test_wartung_vertrag_marker.py
# erzwingt, dass jeder grenzueberschreitende Test den Marker traegt.
markers =
    vertrag: liest Quelldateien ausserhalb von backend/ (laeuft zusaetzlich in vertrag-tests.yml)
