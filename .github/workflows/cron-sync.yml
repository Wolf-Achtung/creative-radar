name: Cron Sync

# Triggers the Apify cron-sync endpoint every Sunday at 06:00 UTC.
# Schedule expression: minute hour day-of-month month day-of-week
#   "0 6 * * 0"  — Sunday (0) at 06:00 UTC
# Berlin time: 08:00 CET (winter) / 07:00 CEST (summer).
# B-Class channel rotation cycles through 3 buckets — sunday picks one bucket per week,
# the other two get picked up in the following weeks.
#
# Setup once (Wolf-Aktion, see PR body):
#   Settings -> Secrets and variables -> Actions
#     CR_API_URL    = https://api.creative-radar.de
#     CR_API_TOKEN  = <bearer token used for manual curl>

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron-sync endpoint
        run: |
          response=$(curl -sS -X POST "${{ secrets.CR_API_URL }}/api/admin/cron/sync-all" \
            -H "Authorization: Bearer ${{ secrets.CR_API_TOKEN }}" \
            -w "\n%{http_code}" \
            --max-time 30)

          http_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response Body: $body"

          if [ "$http_code" != "202" ]; then
            echo "ERROR: Expected 202 Accepted, got $http_code"
            exit 1
          fi

          echo "Cron sync triggered successfully."
