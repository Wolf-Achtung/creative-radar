name: Cron Sync

# Manueller Fallback-Trigger fuer den Apify-Cron-Sync-Endpoint.
#
# Incident 2026-07-13: der bisherige ``schedule: '0 3 * * 1'``-Trigger
# feuerte ueber sieben beobachtete Wochen hinweg konsistent 1,5-4,5h zu
# spaet (GitHubs eigenes Best-effort-Scheduling fuer den geteilten
# Actions-Runner-Pool, kein Bug in diesem Repo). Der primaere woechentliche
# Trigger laeuft seitdem in-process im Backend selbst
# (``backend/app/services/cron_scheduler.py`` — derselbe immer-laufende
# Railway-Web-Prozess pollt die Uhrzeit selbst, keine externe Runner-Queue
# mehr im Trigger-Pfad). Der ``schedule:``-Block hier wurde deshalb entfernt;
# dieser Workflow existiert nur noch fuer manuelle Verifikations-/Recovery-
# Laeufe ueber die GitHub-Actions-UI.
#
# Cadence-Sprint 2026-05-17: der (ehemalige) Schedule war bewusst auf Montag
# gelegt, damit Brief-Generation in derselben Cron-Stage läuft, in der
# Cutter Montag früh ins Office kommen — gilt unveraendert fuer den
# In-Process-Trigger.
#
# Setup once (Wolf-Aktion, see PR body):
#   Settings -> Secrets and variables -> Actions
#     CR_API_URL    = https://api.creative-radar.de
#     CR_API_TOKEN  = <bearer token used for manual curl>
#
# ``workflow_dispatch`` erlaubt manuelle Runs über die GitHub-Actions-UI
# (Actions → "Cron Sync" → "Run workflow") — z.B. zur Verifikation oder als
# Notfall-Fallback, falls der In-Process-Trigger mal ausfaellt.

on:
  workflow_dispatch:

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron-sync endpoint
        run: |
          response=$(curl -sS -X POST "${{ secrets.CR_API_URL }}/api/admin/cron/sync-all" \
            -H "Authorization: Bearer ${{ secrets.CR_API_TOKEN }}" \
            -w "\n%{http_code}" \
            --max-time 30)

          http_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response Body: $body"

          if [ "$http_code" != "202" ]; then
            echo "ERROR: Expected 202 Accepted, got $http_code"
            exit 1
          fi

          echo "Cron sync triggered successfully."
