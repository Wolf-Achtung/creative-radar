name: Backend Tests

# Runs the backend pytest suite against a real Postgres-18 service so the
# advisory-lock paths and schema-qualified queries exercise the same
# dialect that production runs on. Triggered on every PR that touches
# ``backend/**`` and on pushes to ``main`` (baseline tracking).
#
# (Wartung 19.08.2026: hier stand "Postgres-13". Der Service-Container
# laeuft seit laengerem auf ``postgres:18``, gleiche Major-Version wie
# Railway und docker-compose.)
#
# Setup once (Wolf-Aktion after first green run):
#   Settings -> Branches -> Branch protection rules -> main
#     Require status checks to pass before merging: backend-tests / pytest
#   (see PR body for the full anleitung).

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cr
          POSTGRES_PASSWORD: cr
          POSTGRES_DB: creative_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cr -d creative_radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cr:cr@localhost:5432/creative_radar
      # Wartung 19.08.2026: ``PGPASSWORD`` ist hier weg. Der Wert wurde
      # ausschliesslich von ``psql`` gelesen, und ``psql`` gibt es in
      # diesem Workflow nicht mehr (s.u.). Das Passwort steht ohnehin in
      # der DATABASE_URL.

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Audit 2026-08-17: requirements-dev.txt inkludiert requirements.txt
          # und liefert pytest/pytest-asyncio — die Test-Tools liegen nicht
          # mehr in den Prod-Requirements.
          pip install -r backend/requirements-dev.txt

      - name: Auf Postgres warten und das creative_radar-Schema anlegen
        # Wartung 19.08.2026 — vorher waren das drei Schritte:
        # ``apt-get install postgresql-client``, dann ``pg_isready`` in einer
        # Bash-Schleife, dann ``psql -c "CREATE SCHEMA ..."``.
        #
        # Am 19.08. ist der Lauf ZWEIMAL hintereinander im apt-Schritt
        # stehengeblieben: ``azure.archive.ubuntu.com`` war nicht
        # erreichbar, apt hat die Paketquellen viermal vergeblich
        # angefragt und dabei 9:47 bzw. 9:52 Minuten verbraucht — das
        # Job-Limit von 10 Minuten lief ab, bevor ein einziger Test
        # startete. Zwei rote Laeufe, kein einziger Testfehler.
        #
        # ``psycopg`` steht als ``psycopg[binary]`` in requirements.txt und
        # ist nach dem Schritt darueber installiert. Es kann beides, was
        # hier gebraucht wird. Damit faellt die apt-Abhaengigkeit ersatzlos
        # weg: keine fremde Paketquelle, kein Mirror, keine Wartezeit.
        #
        # Warum ueberhaupt gewartet wird, obwohl der Service-Container
        # schon einen ``--health-cmd`` hat: der Healthcheck deckt den
        # Container ab, nicht die Port-Weiterleitung auf den Runner. Die
        # Schleife ist billig und macht den Schritt unabhaengig davon.
        #
        # Warum das Schema hier angelegt wird: Alembics env.py erwartet es
        # fuer Postgres-Deployments (version_table_schema='creative_radar').
        # Railway legt es ausserhalb an, CI macht es ausdruecklich.
        run: |
          python - <<'PY'
          import os
          import sys
          import time

          import psycopg

          dsn = os.environ["DATABASE_URL"]
          letzter_fehler = None

          for versuch in range(1, 31):
              try:
                  with psycopg.connect(dsn, connect_timeout=3) as conn:
                      conn.execute("CREATE SCHEMA IF NOT EXISTS creative_radar")
                      conn.commit()
              except psycopg.OperationalError as exc:
                  letzter_fehler = exc
                  time.sleep(1)
                  continue
              print(f"postgres bereit nach Versuch {versuch}; Schema angelegt")
              sys.exit(0)

          print(f"postgres war nach 30s nicht erreichbar: {letzter_fehler}", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Bootstrap schema via SQLModel.metadata.create_all
        # Production was originally built via a one-shot
        # SQLModel.metadata.create_all() (which honours
        # __table_args__={'schema': 'creative_radar'}), then alembic was
        # stamped at baseline. The autogenerated baseline migration
        # cf842bbfaeb5 lacks schema='creative_radar' arguments AND the
        # post-baseline migrations (7e3b2c4a8f51, etc.) CREATE TYPEs that
        # SQLAlchemy/SQLModel already creates implicitly from Enum columns
        # — so a fresh ``alembic upgrade head`` collides on duplicate
        # enums. The same shape applies in CI.
        #
        # ``import app.models`` matches the side-effect import used in
        # backend/migrations/env.py:8 (single source of truth for "which
        # modules register entities").
        working-directory: backend
        run: |
          python -c "
          import app.models  # noqa: F401 — side-effect registration
          from sqlmodel import SQLModel
          from app.database import engine
          SQLModel.metadata.create_all(engine)
          print('bootstrap: tables created in creative_radar schema')
          "

      - name: Stamp alembic at HEAD
        # The bootstrap above already reflects the post-HEAD schema
        # state. Stamping at HEAD tells alembic "every migration is
        # applied" without re-running any of them — avoids the
        # duplicate-enum / duplicate-column collisions a fresh upgrade
        # would hit.
        #
        # The migration chain itself is covered by the
        # test_migration_*.py SQLite-roundtrip tests, so we lose no
        # coverage by skipping a fresh upgrade here. If we ever want to
        # exercise the upgrade on real Postgres in CI, the right fix is
        # a separate sprint that backfills schema='creative_radar' into
        # the baseline migration and de-duplicates the enum-creation
        # paths.
        working-directory: backend
        run: alembic stamp head

      - name: Run pytest
        working-directory: backend
        # Step-level DATABASE_URL override (PR #143 setup-fix):
        # The job-level ``DATABASE_URL=postgresql://...`` is needed by the
        # bootstrap + alembic-stamp steps above so they exercise the
        # production Postgres dialect (schema-qualified tables, enum
        # types, advisory-lock SQL). Pytest itself must NOT see the
        # postgres URL, because the per-test fixtures (e.g.
        # test_admin_regenerate_replace.py:db, test_brief_previous_context.py:db,
        # test_json_parse_retry.py:db, ...) each create a tempfile sqlite
        # engine and call ``SQLModel.metadata.create_all`` on it.
        # ``entities.py:_resolve_table_schema`` decides at module-import
        # time whether the metadata carries ``schema='creative_radar'``
        # based on ``settings.database_url``. If pytest imports the
        # entities while DATABASE_URL is postgres, every test fixture
        # crashes with ``sqlite3.OperationalError: unknown database
        # creative_radar`` at fixture-setup. Step-level env wins over
        # job-level env, so this single override flips the resolver back
        # to the no-schema sqlite mode that the existing fixtures expect.
        # ``--ignore=app/tests/integration`` keeps the Postgres-only
        # integration suite (Variante-Z Phase 1) out of this step — those
        # tests run in their own pytest invocation below with the postgres
        # URL restored.
        env:
          # Quote required: the bare ``sqlite:///:memory:`` value ends with
          # a colon, which the YAML scanner misreads as a mapping
          # separator (ScannerError "mapping values are not allowed here"
          # at the trailing colon). Always quote env values that contain
          # colons.
          DATABASE_URL: "sqlite:///:memory:"
        # --maxfail=1 stops at the first failing test so the log isn't a wall
        # of red. -v keeps the test names readable in the GitHub UI without
        # spamming the diff view.
        run: pytest -v --maxfail=1 --ignore=app/tests/integration

      - name: Run Postgres integration suite
        working-directory: backend
        # Variante-Z Phase 1 (Sprint 2026-05-25): focused integration
        # tests for the Postgres-only code paths that the SQLite suite
        # cannot exercise — ``pg_advisory_xact_lock`` semantics in
        # ``_acquire_brief_lock`` and the ``creative_radar``-schema
        # attachment in ``entities._CR_TABLE_ARGS``. Inherits the
        # job-level ``DATABASE_URL=postgresql://...`` because this is
        # exactly the dialect we want to test. Bootstrap + alembic stamp
        # already ran above; the integration conftest does its own
        # DROP SCHEMA + CREATE SCHEMA per test so leftover state is not
        # a concern. Running locally without Postgres? The pg_engine
        # fixture skips cleanly — no infra dependency for the laptop
        # workflow.
        run: pytest app/tests/integration/ -v
